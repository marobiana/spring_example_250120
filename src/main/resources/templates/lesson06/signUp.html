<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="utf-8">
    <title>회원가입</title>
    <!-- bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.7.1.js" integrity="sha256-eKhayi8LEQwp4NKxN+CfCh+3qOVUtJn3QNZ0TciWLP4=" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
</head>
<body>
	<div class="container">
        <h1>회원가입</h1>
        <div class="form-group">
            <label for="email">이메일</label>
            
            <div class="d-flex">
	            <input type="text" id="email" class="form-control col-4">
	            <button type="button" id="emailCheckBtn" class="btn btn-warning">중복확인</button>
	        </div>
	        
	        <small id="statusArea"></small>
        </div>
        
        <input type="button" id="joinBtn" value="회원가입" class="btn btn-info">
    </div>
    
    <script>
    	$(function() {
    		// 중복확인 버튼 클릭
    		$("#emailCheckBtn").on("click", function() {
    			// statusArea의 하위 태그들 제거
    			$("#statusArea").empty(); // 자식/손주 태그들 모두 비운다.
    			//alert("중복확인");
    			
    			let email = $("#email").val().trim();
    			if (!email) {
    				$("#statusArea").append('<span class="text-danger">이름이 비어있습니다.</span>');
    				return;
    			}
    			
    			// AJAX - email 중복 체크 DB에서
    			$.ajax({
    				// request
    				type:"get" // get일 때 생략 가능
    				, url:"/lesson06/ex02/is-duplicate-email"
    				, data:{"email":email}
    			
    				// response-callback 함수
    				, success:function(data) { // JSON string -> Parsing -> dict
    					// {"code":200, "is_duplicate":true}    true:중복
    					// 중복일 때 문구 노출
    					if (data.is_duplicate) {
    						$("#statusArea").append('<span class="text-danger">중복된 이메일입니다.</span>');
    					}
    				}
    				, error:function(error) {
    					alert("중복확인에 실패했습니다.");
    				}
    			});
    		});
    		
    		// 회원가입
    		$("#joinBtn").on("click", function() {
    			// statusArea에 자식태그가 아무것도 없다면 가입
    			console.log($("#statusArea").children());
    			
    			if ($("#statusArea").children().length < 1) {
	    			alert("회원가입");
    			} else {
    				alert("이메일 중복 확인을 하세요");
    			}
    		});
    	});
    </script>
</body>
</html>
